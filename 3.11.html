<form action="https://wp.zybooks.com/form-viewer.php" method="post">
    <p>
        <label for="email">Email address:</label>
        <input
                type="email"
                id="email"
                name="email"
                pattern="[a-zA-Z0-9-_.]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*"
                required>
    </p>

    <p>
        <label for="date">Date to send:</label>
        <input type="date" id="date" name="date">
    </p>

    <p>
        <label for="color">Message color:</label>
        <input type="color" id="color" name="color">
    </p>

    <p>
        <label for="blinks">Number of blinks:</label>
        <input type="number" id="blinks" name="blinks" value="0" min="0" max="10">
    </p>

    <p>
        <label for="volume">Music volume:</label>
        <input type="range" id="volume" name="volume" value="20" min="0" max="50">
    </p>

    <p>
        <button type="submit">Send Birthday Message</button>
    </p>
</form>
